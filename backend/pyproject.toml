[project]
name="operai-api"
version="0.1.0"
requires-python=">=3.12"
dependencies=["fastapi>=0.116","uvicorn[standard]>=0.35","sqlalchemy[asyncio]>=2.0","asyncpg>=0.30","psycopg2-binary>=2.9","alembic>=1.16","pydantic-settings>=2.10","pyjwt[crypto]>=2.10","pwdlib[argon2]>=0.2","email-validator>=2.2","httpx>=0.28","cryptography>=45.0","pypdf>=5.0","python-docx>=1.1","python-multipart>=0.0.9","pymupdf>=1.24","pytesseract>=0.3.10","Pillow>=10.0"]
[project.optional-dependencies]
dev=["pytest>=8.4","pytest-asyncio>=1.1","ruff>=0.12"]
[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[tool.setuptools.packages.find]
include=["app*"]
[tool.pytest.ini_options]
asyncio_mode="auto"
testpaths=["tests"]
[tool.ruff]
line-length=100
target-version="py312"
